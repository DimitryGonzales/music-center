<!doctype html>
<html lang="en" page="main">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Center</title>

        <!--Font Inter-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />

        <!--Font Awesome-->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!--CSS-->
        <link rel="stylesheet" href="assets/css/styles.css" />

        <!--JS-->
        <script src="assets/js/app.js" defer></script>
    </head>
    <body>
        <header class="header">
            <a href="#" class="logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-music"></i>
                </div>

                <h1 class="logo-title">Music Center</h1>
            </a>

            <nav>
                <ul>
                    <li class="header-link-wrapper">
                        <a
                            href="#musics"
                            class="header-link underline-when-hover"
                            >Músicas</a
                        >
                        <a href="#info" class="header-link underline-when-hover"
                            >Informações</a
                        >
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="musics">
                <header class="section-header">
                    <h2 class="section-title">Músicas</h2>

                    <input
                        type="text"
                        placeholder="Pesquisar música..."
                        id="search-music"
                    />
                </header>

                <div id="music-wrapper"></div>
            </section>
        </main>

        <footer class="footer" id="info">
            <section class="footer-section">
                <h2 class="footer-section-title">Sobre</h2>

                <p class="about">
                    Ferramenta web que extrai e reúne informações gerais sobre
                    músicas, álbuns e artistas em um só lugar.
                </p>
            </section>

            <section class="footer-section">
                <h2 class="footer-section-title">Autoria</h2>

                <div class="profile">
                    <p class="profile-info">
                        Aluno:

                        <span class="profile-info-content">Dimitry</span>
                    </p>
                    <p class="profile-info">
                        Curso:

                        <span class="profile-info-content"
                            >Engenharia de Software</span
                        >
                    </p>
                    <p class="profile-info">
                        Turma:

                        <span class="profile-info-content">Manhã</span>
                    </p>
                </div>
            </section>
        </footer>
    </body>
</html>
