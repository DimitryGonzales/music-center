<!doctype html>
<html lang="en" page="main">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Center</title>

        <!--Glide JS -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/Glide.js/3.6.0/glide.min.js"
            integrity="sha512-2sI5N95oT62ughlApCe/8zL9bQAXKsPPtZZI2KE3dznuZ8HpE2gTMHYzyVN7OoSPJCM1k9ZkhcCo3FvOirIr2A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>

        <!--Glide CSS -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/Glide.js/3.6.0/css/glide.core.min.css"
            integrity="sha512-tYKqO78H3mRRCHa75fms1gBvGlANz0JxjN6fVrMBvWL+vOOy200npwJ69OBl9XEsTu3yVUvZNrdWFIIrIf8FLg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/Glide.js/3.6.0/css/glide.theme.min.css"
            integrity="sha512-8vDOoSF7kZUYkn7BiQulRCTvpRoenljlkQDZhM6+IqDJi5jHDH9QEYH9NfMBB8LlqiYc7O17YGxbGx7dOxKrpw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!--Font Inter-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />

        <!--Font Awesome-->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!--CSS-->
        <link rel="stylesheet" href="assets/css/styles.css" />

        <!--JS-->
        <script src="assets/js/app.js" defer></script>
    </head>
    <body>
        <header class="header">
            <a href="#" class="logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-music"></i>
                </div>

                <h1 class="logo-title">Music Center</h1>
            </a>

            <nav>
                <ul>
                    <li class="header-link-wrapper">
                        <a
                            href="#musics"
                            class="header-link underline-when-hover"
                            >Músicas</a
                        >
                        <a href="#info" class="header-link underline-when-hover"
                            >Informações</a
                        >
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="glide">
                <div class="glide__track" data-glide-el="track">
                    <ul class="glide__slides" id="carrousel"></ul>
                </div>

                <div class="glide__arrows" data-glide-el="controls">
                    <button
                        class="glide__arrow glide__arrow--left"
                        data-glide-dir="<"
                    >
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button
                        class="glide__arrow glide__arrow--right"
                        data-glide-dir=">"
                    >
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

                <div class="glide__bullets" data-glide-el="controls[nav]"></div>
            </div>

            <section id="musics">
                <header class="section-header">
                    <h2 class="section-title">Músicas</h2>

                    <input
                        type="text"
                        placeholder="Pesquisar música..."
                        id="search-music"
                    />
                </header>

                <div id="music-wrapper"></div>
            </section>
        </main>

        <footer class="footer" id="info">
            <section class="footer-section">
                <h2 class="footer-section-title">Sobre</h2>

                <p class="about">
                    Ferramenta web que extrai e reúne informações gerais sobre
                    músicas, álbuns e artistas em um só lugar.
                </p>
            </section>

            <section class="footer-section">
                <h2 class="footer-section-title">Autoria</h2>

                <div class="profile">
                    <p class="profile-info">
                        Aluno:

                        <span class="profile-info-content"
                            >Dimitry Silva Gonzales Alves</span
                        >
                    </p>
                    <p class="profile-info">
                        Curso:

                        <span class="profile-info-content"
                            >Engenharia de Software</span
                        >
                    </p>
                    <p class="profile-info">
                        Turma:

                        <span class="profile-info-content">Manhã</span>
                    </p>
                </div>
            </section>
        </footer>
    </body>
</html>
